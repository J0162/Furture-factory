<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link rel="stylesheet" href="/login.css">
</head>
<body>

<form action="/login" method="post">
    <div class="container">
        <h2>Inloggen</h2>
        <p class="error" id="error-msg" style="color: red; display: none; font-weight: bold;">Ongeldige gebruikersnaam en/of wachtwoord</p>
        <label for="uname"><b>Gebruikersnaam</b></label>
        <input type="text" placeholder="Vul hier gebruikersnaam" name="uname" required>

        <label for="psw"><b>Wachtwoord</b></label>
        <input type="password" placeholder="Vul hier wachtwoord" name="psw" required>

        <button type="submit">Login</button>
        <label>
        <input type="checkbox" checked="checked" name="remember"> Onthoud login
        </label>
    </div>
</form>
<script>
    if (new URLSearchParams(location.search).has('error')) {
        document.getElementById('error-msg').style.display = 'block';
    }
</script>

<div class="container" style="background-color:#f1f1f1">
    <span class="psw">Forgot <a href="#">password?</a></span>
</div>

</body>
</html>
