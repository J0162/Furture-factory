<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <title>Bestellingen dashboard</title>
  <link rel="stylesheet" href="/dashboard%20bestellingen.css">
</head>
<body>

    <nav>
        <a href="/efficientie">Efficiëntie</a>
        <form action="/logout" method="post">
          <input type="hidden" name="_csrf" value="">
          <button type="submit">Uitloggen</button>
        </form>
    </nav>

  <h1>Bestellingen dashboard</h1>

  <div class="box nieuwe-bestelling">
    <h2>Nieuwe bestelling maken</h2>

    <label for="kies-product">Product</label>
    <select id="kies-product">
      <option value="" selected disabled></option>
      <option value="1">Rood</option>
      <option value="2">Blauw</option>
      <option value="3">Groen</option>
    </select>

    <label for="kies-gewicht">Gewicht</label>
    <select id="kies-gewicht">
      <option value="" selected disabled></option>
      <option value="1">15 kg</option>
      <option value="2">25 kg</option>
      <option value="3">50 kg</option>
    </select>

    <button id="nieuwe-bestelling">Bestelling toevoegen</button>
    <span id="bestel-melding"></span>
  </div>

  <div class="blokken">
    <div class="blok">
      <div class="getal" id="totaal">0</div>
      Totaal bestellingen
    </div>
    <div class="blok">
      <div class="getal" id="open">0</div>
      Nog te doen
    </div>
    <div class="blok">
      <div class="getal" id="klaar">0</div>
      Afgerond
    </div>
  </div>

  <div class="box">
    <h2>Hoeveel bestellingen zijn er nog over?</h2>
    <svg id="grafiek" width="600" height="250" xmlns="http://www.w3.org/2000/svg"></svg>
    <br>
    <button id="grafiek-opslaan">Grafiek opslaan</button>
  </div>

  <div class="box">
    <h2>Openstaande bestellingen in de tijd</h2>
    <svg id="lijngrafiek" width="600" height="250" xmlns="http://www.w3.org/2000/svg"></svg>
    <br>
    <button id="lijn-opslaan">Grafiek opslaan</button>
  </div>

  <div class="box">
    <h2>Producten in openstaande bestellingen</h2>
    <div id="producten"></div>
  </div>

  <div class="box">
    <h2>Alle bestellingen</h2>
    <table>
      <thead>
        <tr>
          <th>Nummer</th>
          <th>Kleur</th>
          <th>Gewicht</th>
          <th>Status</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tabel"></tbody>
    </table>
  </div>

<script src="/dashboard%20bestellingen.js"></script>

</body>
</html>
